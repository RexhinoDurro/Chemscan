services:
  postgres:
    image: postgres:16
    container_name: chemscan-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - chemscan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chemscan-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chemistry:
    build: ./backend-chemistry
    container_name: chemscan-chemistry
    ports:
      - "8101:8001"
    environment:
      REDIS_URL: ${REDIS_URL}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  ai:
    build: ./backend-ai
    container_name: chemscan-ai
    ports:
      - "3501:3001"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  django:
    build: ./backend-django
    container_name: chemscan-django
    ports:
      - "8100:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      REDIS_URL: ${REDIS_URL}
      CHEMISTRY_SERVICE_URL: ${CHEMISTRY_SERVICE_URL}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CHEMISTRY_URL: ${NEXT_PUBLIC_CHEMISTRY_URL}
        NEXT_PUBLIC_AI_URL: ${NEXT_PUBLIC_AI_URL}
    container_name: chemscan-frontend
    ports:
      - "3100:3000"
    depends_on:
      - django
      - chemistry
      - ai
    restart: unless-stopped

volumes:
  chemscan_postgres_data:
